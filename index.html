<p>WHINSET · v2.0.0-rc.1</p><h1>先看清计划，再让 Windows 安静地完成。</h1>
<p>精确软件 ID、依赖 DAG、用户/管理员操作分离、单次 UAC、结构化日志与可恢复状态。支持 PowerShell 7，并保留 Windows PowerShell 5.1 兼容。</p>
<p><a href="https://github.com/styayur/whinset">查看仓库与完整说明</a> · <a href="https://github.com/styayur/whinset/releases">Release / beatwin.txt</a> · <a href="https://github.com/styayur/whinset/blob/main/docs/security-model.md">安全与权限模型</a></p>
<p><strong>发布状态：</strong>当前为 v2.0.0-rc.1。真实 Windows 11 虚拟机的 UAC、管理员安装和重启续跑验收尚未完成，因此 final v2.0.0 暂不发布。</p>
<h2>下载前需要了解</h2><p>管理员操作可能安装机器级软件、启用 Windows 功能、安装 WSL/Ubuntu/Docker Desktop，并修改机器 JAVA_HOME/PATH。用户操作可能修改 Git LFS、uv、Conda、Go、Rust 与用户环境变量。UAC 使用 Windows 正常授权，不绕过、不关闭。</p>
<p>apply 仅在仍有管理员操作时请求一次 UAC；拒绝时退出 4。可能需要重启，返回 3010 后手动重启并执行 recover -Retry。没有自动回滚承诺；日志与状态位于 %LOCALAPPDATA%\Whinset\v2。</p>
<h2>1. 预览计划</h2>
<pre><code>pwsh -NoProfile -File .\whinset.ps1 plan -Profile Developer
pwsh -NoProfile -File .\whinset.ps1 plan -Profile Minimal -Exclude Chrome -Json</code></pre>
<h2>2. 安装命令并执行已审阅计划</h2>
<pre><code>pwsh -NoProfile -File .\whinset.ps1 install-cli
whinset doctor
whinset apply -Profile Minimal -AcceptAgreements</code></pre>
<p>软件标识只接受稳定 Key 或精确 Source:Id。显示名称不是安装选择器；相似候选会显示 vendor、ID、来源、架构、作用域和权限，不会静默猜测。</p>
<h2>3. 恢复与诊断</h2>
<pre><code>whinset status
whinset recover
whinset recover -Retry
whinset doctor -Json</code></pre>
<p>退出码：0 完成，1 操作失败，2 输入/计划错误，3 兼容流程取消，4 拒绝 UAC，5 doctor 不健康，3010 需要重启。旧 SetupNewPC 状态只读发现，不删除、不改写。</p>
