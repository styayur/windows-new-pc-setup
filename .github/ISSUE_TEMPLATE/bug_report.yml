name: Bug report
description: Report a reproducible Windows provisioning problem.
title: '[Bug]: '
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v2.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows, PowerShell, and WinGet versions
      placeholder: Windows 11 24H2; PowerShell 7.5; WinGet 1.11
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command used
      description: Include the full command and profile/config path. Remove private paths or usernames.
      render: powershell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run preview with ...
        2. Confirm expectations ...
        3. Execute with ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and exit code
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Redact hostnames, usernames, local paths, tenant details, tokens, licenses, and installed-package inventory if private.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety and privacy check
      options:
        - label: I tested in a VM, disposable machine, or after a backup where system changes were possible.
          required: true
        - label: I removed credentials, private paths, and identifying machine data from this report.
          required: true
        - label: This is not a security vulnerability. I will follow SECURITY.md for security reports.
          required: true
