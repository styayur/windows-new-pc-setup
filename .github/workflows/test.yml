name: PowerShell regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regression suite on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Run-Tests.ps1
  powershell-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regression suite on PowerShell 7
        shell: pwsh
        run: ./tests/Run-Tests.ps1
