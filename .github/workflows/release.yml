name: Release provisioning bundle

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag to package, for example v2.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0
      - name: Validate release tag and regression suite
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if (-not $version) { $version = '${{ github.ref_name }}' }
          if ($version -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must use vX.Y.Z: $version" }
          git describe --exact-match --tags HEAD
          ./tests/Run-Tests.ps1
      - name: Assemble deterministic repository bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ inputs.version }}'
          if (-not $version) { $version = '${{ github.ref_name }}' }
          $stage = Join-Path $env:RUNNER_TEMP 'windows-new-pc-setup'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item SetupNewPC_Optimized.ps1,Setupnewpc.ps1,Install-Applications.WithConfirmation.ps1,README.md,LICENSE,config,src,examples,docs -Destination $stage -Recurse
          $archive = "windows-new-pc-setup-$version.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          Get-FileHash -Algorithm SHA256 $archive | ForEach-Object { "$($_.Hash.ToLower())  $archive" } | Set-Content -Encoding utf8NoBOM SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            windows-new-pc-setup-*.zip
            SHA256SUMS.txt
